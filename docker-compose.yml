name: dark-ipfs-${NODE_ID}

services:
  ipfs:
    image: ipfs/kubo:${KUBO_IMAGE_TAG:-v0.41.0}
    container_name: dark-ipfs-${NODE_ID}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/ipfs-entrypoint.sh"]
    environment:
      NODE_NAME: ${NODE_ID}
      IPFS_ANNOUNCE_MULTIADDRESS: ${IPFS_ANNOUNCE_MULTIADDRESS}
      IPFS_BOOTSTRAP_HOSTS: ${IPFS_BOOTSTRAP_HOSTS:-}
      CLUSTER_SEED: ${CLUSTER_SEED:-false}
      IPFS_SWARM_KEY_FILE: /run/secrets/ipfs-swarm.key
    volumes:
      - ./scripts/ipfs-entrypoint.sh:/usr/local/bin/ipfs-entrypoint.sh:ro
      - ${IPFS_SWARM_KEY_FILE}:/run/secrets/ipfs-swarm.key:ro
      - ipfs-data:/data/ipfs
      - ipfs-export:/export
    ports:
      - "${VPN_ADDRESS}:5001:5001/tcp"
      - "${VPN_ADDRESS}:4001:4001/tcp"
      - "${VPN_ADDRESS}:4001:4001/udp"
    healthcheck:
      test: ["CMD-SHELL", "ipfs id >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - storage

  cluster:
    image: ipfs/ipfs-cluster:${IPFS_CLUSTER_IMAGE_TAG:-v1.1.6}
    container_name: dark-ipfs-cluster-${NODE_ID}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/cluster-entrypoint.sh"]
    depends_on:
      ipfs:
        condition: service_healthy
    environment:
      CLUSTER_PEERNAME: ${NODE_ID}
      CLUSTER_SECRET_FILE: /run/secrets/ipfs-cluster-secret
      CLUSTER_CONSENSUS: crdt
      CLUSTER_CRDT_CLUSTERNAME: ${CLUSTER_NAME}
      CLUSTER_CRDT_TRUSTEDPEERS: "*"
      CLUSTER_CRDT_BATCHING_MAXBATCHSIZE: "0"
      CLUSTER_CRDT_BATCHING_MAXBATCHAGE: 0s
      CLUSTER_REPLICATIONFACTORMIN: ${CLUSTER_REPLICATION_MIN}
      CLUSTER_REPLICATIONFACTORMAX: ${CLUSTER_REPLICATION_MAX}
      CLUSTER_DISABLEREPINNING: "false"
      CLUSTER_BOOTSTRAP_HOSTS: ${CLUSTER_BOOTSTRAP_HOSTS:-}
      CLUSTER_SEED: ${CLUSTER_SEED:-false}
      CLUSTER_ANNOUNCEMULTIADDRESS: ${CLUSTER_ANNOUNCE_MULTIADDRESS}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs/tcp/5001
      CLUSTER_IPFSPROXY_NODEMULTIADDRESS: /dns4/ipfs/tcp/5001
      CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9094
      CLUSTER_IPFSPROXY_LISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9095
      CLUSTER_PROXYAPI_LISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9095
      CLUSTER_TAGS_TAGS: site:${SITE_ID},node:${NODE_ID}
      CLUSTER_BALANCED_ALLOCATEBY: tag:site,freespace
      CLUSTER_MONITORPINGINTERVAL: 2s
    volumes:
      - ./scripts/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
      - ${IPFS_CLUSTER_SECRET_FILE}:/run/secrets/ipfs-cluster-secret:ro
      - cluster-data:/data/ipfs-cluster
    ports:
      - "${VPN_ADDRESS}:9094:9094/tcp"
      - "${VPN_ADDRESS}:9095:9095/tcp"
      - "${VPN_ADDRESS}:9096:9096/tcp"
      - "${VPN_ADDRESS}:9096:9096/udp"
    healthcheck:
      test: ["CMD-SHELL", "ipfs-cluster-ctl id >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - storage

networks:
  storage:
    name: dark-ipfs-${NODE_ID}
    driver: bridge

volumes:
  ipfs-data:
    name: dark-ipfs-${NODE_ID}-data
  ipfs-export:
    name: dark-ipfs-${NODE_ID}-export
  cluster-data:
    name: dark-ipfs-${NODE_ID}-cluster-data
