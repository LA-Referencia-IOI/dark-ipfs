name: dark-ipfs

services:
  ipfs0:
    image: ipfs/kubo:${KUBO_IMAGE_TAG:-latest}
    container_name: dark-ipfs-ipfs0
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/ipfs-entrypoint.sh"]
    environment:
      NODE_NAME: ipfs0
    volumes:
      - ./scripts/ipfs-entrypoint.sh:/usr/local/bin/ipfs-entrypoint.sh:ro
      - ipfs0-data:/data/ipfs
      - ipfs0-export:/export
    ports:
      - "${IPFS0_API_PORT:-5001}:5001"
      - "${IPFS0_GATEWAY_BIND:-127.0.0.1}:${IPFS0_GATEWAY_PORT:-38080}:8080"
      - "${IPFS0_SWARM_PORT:-4001}:4001"
    healthcheck:
      test: ["CMD-SHELL", "ipfs id >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - dark-ipfs

  ipfs1:
    image: ipfs/kubo:${KUBO_IMAGE_TAG:-latest}
    container_name: dark-ipfs-ipfs1
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/ipfs-entrypoint.sh"]
    depends_on:
      ipfs0:
        condition: service_healthy
    environment:
      NODE_NAME: ipfs1
      BOOTSTRAP_NODE: ipfs0
    volumes:
      - ./scripts/ipfs-entrypoint.sh:/usr/local/bin/ipfs-entrypoint.sh:ro
      - ipfs1-data:/data/ipfs
      - ipfs1-export:/export
    healthcheck:
      test: ["CMD-SHELL", "ipfs id >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - dark-ipfs

  ipfs2:
    image: ipfs/kubo:${KUBO_IMAGE_TAG:-latest}
    container_name: dark-ipfs-ipfs2
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/ipfs-entrypoint.sh"]
    depends_on:
      ipfs0:
        condition: service_healthy
    environment:
      NODE_NAME: ipfs2
      BOOTSTRAP_NODE: ipfs0
    volumes:
      - ./scripts/ipfs-entrypoint.sh:/usr/local/bin/ipfs-entrypoint.sh:ro
      - ipfs2-data:/data/ipfs
      - ipfs2-export:/export
    healthcheck:
      test: ["CMD-SHELL", "ipfs id >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - dark-ipfs

  cluster0:
    image: ipfs/ipfs-cluster:${IPFS_CLUSTER_IMAGE_TAG:-latest}
    container_name: dark-ipfs-cluster0
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/cluster-entrypoint.sh"]
    depends_on:
      ipfs0:
        condition: service_healthy
    environment:
      CLUSTER_PEERNAME: cluster0
      CLUSTER_SECRET: ${CLUSTER_SECRET}
      CLUSTER_CONSENSUS: crdt
      CLUSTER_CRDT_TRUSTEDPEERS: "*"
      CLUSTER_REPLICATIONFACTORMIN: ${CLUSTER_REPLICATION_MIN:-2}
      CLUSTER_REPLICATIONFACTORMAX: ${CLUSTER_REPLICATION_MAX:-3}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs0/tcp/5001
      CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9094
      CLUSTER_PROXYAPI_LISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9095
      CLUSTER_MONITORPINGINTERVAL: 2s
    volumes:
      - ./scripts/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
      - cluster0-data:/data/ipfs-cluster
    ports:
      - "${CLUSTER_API_PORT:-9094}:9094"
      - "${CLUSTER_PROXY_PORT:-9095}:9095"
    healthcheck:
      test: ["CMD-SHELL", "ipfs-cluster-ctl id >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - dark-ipfs

  cluster1:
    image: ipfs/ipfs-cluster:${IPFS_CLUSTER_IMAGE_TAG:-latest}
    container_name: dark-ipfs-cluster1
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/cluster-entrypoint.sh"]
    depends_on:
      cluster0:
        condition: service_healthy
      ipfs1:
        condition: service_healthy
    environment:
      CLUSTER_PEERNAME: cluster1
      CLUSTER_SECRET: ${CLUSTER_SECRET}
      CLUSTER_CONSENSUS: crdt
      CLUSTER_CRDT_TRUSTEDPEERS: "*"
      CLUSTER_REPLICATIONFACTORMIN: ${CLUSTER_REPLICATION_MIN:-2}
      CLUSTER_REPLICATIONFACTORMAX: ${CLUSTER_REPLICATION_MAX:-3}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs1/tcp/5001
      CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9094
      BOOTSTRAP_PEER_HOST: cluster0
    volumes:
      - ./scripts/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
      - cluster1-data:/data/ipfs-cluster
    healthcheck:
      test: ["CMD-SHELL", "ipfs-cluster-ctl id >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - dark-ipfs

  cluster2:
    image: ipfs/ipfs-cluster:${IPFS_CLUSTER_IMAGE_TAG:-latest}
    container_name: dark-ipfs-cluster2
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/cluster-entrypoint.sh"]
    depends_on:
      cluster0:
        condition: service_healthy
      ipfs2:
        condition: service_healthy
    environment:
      CLUSTER_PEERNAME: cluster2
      CLUSTER_SECRET: ${CLUSTER_SECRET}
      CLUSTER_CONSENSUS: crdt
      CLUSTER_CRDT_TRUSTEDPEERS: "*"
      CLUSTER_REPLICATIONFACTORMIN: ${CLUSTER_REPLICATION_MIN:-2}
      CLUSTER_REPLICATIONFACTORMAX: ${CLUSTER_REPLICATION_MAX:-3}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs2/tcp/5001
      CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9094
      BOOTSTRAP_PEER_HOST: cluster0
    volumes:
      - ./scripts/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
      - cluster2-data:/data/ipfs-cluster
    healthcheck:
      test: ["CMD-SHELL", "ipfs-cluster-ctl id >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - dark-ipfs

networks:
  dark-ipfs:
    name: dark-ipfs-network
    driver: bridge

volumes:
  ipfs0-data:
  ipfs0-export:
  ipfs1-data:
  ipfs1-export:
  ipfs2-data:
  ipfs2-export:
  cluster0-data:
  cluster1-data:
  cluster2-data:
